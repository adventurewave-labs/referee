<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 340">
  <title id="title">Referee</title>
  <desc id="description">MCP policy enforcement for agents. A request travels from the agent, through the Referee policy check, toward a tool.</desc>
  <style>
    .request { animation: dispatch 3.6s ease-in-out infinite; }
    @keyframes dispatch { 0%, 16% { transform: translateX(0); } 51%, 64% { transform: translateX(135px); } 100% { transform: translateX(275px); } }
    @media (prefers-reduced-motion: reduce) { .request { animation: none; transform: translateX(135px); } }
  </style>
  <rect width="1200" height="340" rx="24" fill="#152443"/>
  <path d="M739 173h343M752 235h317M878 105v159" stroke="#455373" stroke-width="1.5"/>
  <g transform="translate(65 56)">
    <rect width="54" height="54" rx="12" fill="#7e64cd"/>
    <path d="M12 17h30M12 27h30M12 37h30M21 12v30m12-30v30" stroke="#e8e2ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="27" cy="27" r="4.25" fill="#f5d685"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="63" y="200" font-size="92" font-weight="700" fill="#f9fbff">Referee</text>
    <text x="67" y="256" font-size="29" fill="#cbd8ed">Policy enforcement for MCP agents</text>
    <g fill="#e8e2ff" font-size="20" text-anchor="middle">
      <text x="755" y="139">Agent</text><text x="890" y="139">Policy</text><text x="1030" y="139">Tool</text>
    </g>
    <rect x="862" y="146" width="56" height="55" rx="12" fill="#4e369b" stroke="#a997f0" stroke-width="2"/>
    <path d="m870 175 13 12 24-25" fill="none" stroke="#e8e2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="755" cy="173" r="5" fill="#a997f0"/><circle cx="1030" cy="173" r="5" fill="#a997f0"/>
    <circle class="request" cx="755" cy="173" r="8" fill="#f5d685"/>
    <text x="890" y="272" font-size="20" text-anchor="middle" fill="#aebeda">Task scope · provenance · sensitivity</text>
  </g>
</svg>
