<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="784" viewBox="0 0 1200 784" role="img" aria-labelledby="title description">
  <title id="title">The Referee tool-call decision</title>
  <desc id="description">Referee sits between an MCP client and the downstream tool. It checks scope, provenance, and sensitivity, then allows, challenges, or denies the request and writes a verifiable receipt.</desc>
  <rect width="1200" height="784" fill="#f9fbff"/>
  <rect x="36" y="35" width="1128" height="714" rx="29" fill="#edf3fc" stroke="#cbd8ed" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#152443">
    <text x="82" y="118" font-size="59" font-weight="bold">A tool call, evaluated</text>
    <text x="85" y="165" font-size="26" fill="#41516f">Referee checks the request before it reaches an MCP tool.</text>
    <path d="M294 302h141m333 0h132" fill="none" stroke="#4e369b" stroke-width="4"/>
    <path d="m424 292 14 10-14 10m464-20 14 10-14 10" fill="none" stroke="#4e369b" stroke-width="4" stroke-linejoin="round"/>
    <rect x="83" y="250" width="210" height="104" rx="14" fill="#f9fbff" stroke="#cbd8ed" stroke-width="2"/>
    <rect x="437" y="212" width="330" height="181" rx="17" fill="#4e369b"/>
    <rect x="902" y="250" width="215" height="104" rx="14" fill="#f9fbff" stroke="#cbd8ed" stroke-width="2"/>
    <text x="113" y="291" font-size="32" font-weight="bold">Agent</text>
    <text x="113" y="326" font-size="23" fill="#41516f">MCP client</text>
    <text x="472" y="271" font-size="38" font-weight="bold" fill="#f9fbff">Referee</text>
    <text x="472" y="308" font-size="24" fill="#e8e2ff">Task scope</text>
    <text x="472" y="340" font-size="24" fill="#e8e2ff">Source provenance</text>
    <text x="472" y="372" font-size="24" fill="#e8e2ff">Sensitivity rules</text>
    <text x="932" y="291" font-size="32" font-weight="bold">Tool</text>
    <text x="932" y="326" font-size="23" fill="#41516f">Approved call</text>
    <path d="M602 393v51m-385 0h766m-766 0v22m385-22v22m381-22v22" fill="none" stroke="#a997d7" stroke-width="3"/>
    <rect x="82" y="466" width="269" height="80" rx="13" fill="#f9fbff" stroke="#cbd8ed" stroke-width="2"/>
    <rect x="466" y="466" width="271" height="80" rx="13" fill="#f5d685"/>
    <rect x="850" y="466" width="267" height="80" rx="13" fill="#f9fbff" stroke="#cbd8ed" stroke-width="2"/>
    <g font-size="29" font-weight="bold" text-anchor="middle">
      <text x="216" y="517">Allow</text><text x="602" y="517">Challenge</text><text x="982" y="517">Deny</text>
    </g>
    <path d="M215 546v32m387-32v32m380-32v32m-767 0h767m-381 0v24" fill="none" stroke="#a997d7" stroke-width="3"/>
    <rect x="82" y="602" width="1036" height="101" rx="15" fill="#e8e2ff"/>
    <circle cx="128" cy="651" r="15" fill="#4e369b"/>
    <path d="m121 651 5 5 10-11" fill="none" stroke="#f9fbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="645" font-size="30" font-weight="bold">Verifiable receipt</text>
    <text x="161" y="678" font-size="23" fill="#41516f">Record the decision, policy clause, and argument HMAC.</text>
  </g>
</svg>
